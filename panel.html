<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Leads · Fénix Prime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0F0F0F;--panel:#161616;--line:#2b2b2b;--white:#F5F5F5;--grey:#9a9a9a;--gold:#C9A227;--orange:#FF6B00;--wa:#25D366;--green:#2faf63}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--white);font-family:"Poppins",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 90px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .ttl{display:flex;align-items:center;gap:11px}
  .ttl .dot{width:10px;height:10px;border-radius:50%;background:var(--orange)}
  .ttl h1{font-family:"Montserrat";font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
  .ttl span{display:block;color:var(--grey);font-size:12px}
  .meta{display:flex;align-items:center;gap:18px}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey);letter-spacing:.06em;text-transform:uppercase}
  .live .pulse{width:9px;height:9px;border-radius:50%;background:#36d36b;animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(54,211,107,.55)}70%{box-shadow:0 0 0 10px rgba(54,211,107,0)}100%{box-shadow:0 0 0 0 rgba(54,211,107,0)}}
  .count{text-align:right}.count b{font-family:"Montserrat";font-weight:800;font-size:24px;color:var(--gold);display:block;line-height:1}
  .count small{color:var(--grey);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .tools input{flex:1;min-width:180px;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--white);font-family:"Poppins";font-size:14px}
  .tools input:focus{outline:none;border-color:var(--gold)}
  .chips{display:flex;gap:8px}
  .chip{background:#141414;border:1px solid var(--line);color:var(--grey);font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer}
  .chip.on{background:rgba(201,162,39,.12);border-color:var(--gold);color:var(--gold)}
  .upd{color:#6a6a6a;font-size:12px;margin:10px 0 14px}
  .list{display:grid;gap:12px}
  .lead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .lead.new{border-color:var(--orange)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .name{font-family:"Montserrat";font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
  .badge{background:var(--orange);color:#0d0d0d;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:20px;text-transform:uppercase}
  .pill{font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .pill.pend{background:rgba(255,107,0,.12);color:var(--orange);border-color:rgba(255,107,0,.4)}
  .pill.gest{background:rgba(47,175,99,.14);color:#4cd183;border-color:rgba(47,175,99,.4)}
  .sub{color:var(--grey);font-size:13px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .sub b{color:#d8d8d8;font-weight:500}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .days{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .days .lbl{color:var(--grey);font-size:12px;margin-right:4px}
  .dbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#0d0d0d;color:#bbb;font-size:13px;font-weight:600;cursor:pointer}
  .dbtn.on{background:linear-gradient(135deg,var(--gold),var(--orange));color:#0d0d0d;border-color:transparent}
  .last{font-size:12px;color:var(--grey)}
  .last b{color:#e0c98a}
  .last .alert{color:var(--orange);font-weight:600}
  .chat{display:inline-flex;align-items:center;gap:7px;background:var(--wa);color:#063d20;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:11px;white-space:nowrap;border:none;cursor:pointer}
  .chat:hover{transform:translateY(-2px)}.chat.off{background:#2a2a2a;color:#777;pointer-events:none}
  .empty,.err{text-align:center;color:var(--grey);padding:54px 20px;border:1px dashed var(--line);border-radius:14px}
  .empty .ico{font-size:32px;margin-bottom:10px}.err{color:#f0a06a;border-color:rgba(255,107,0,.35)}
  footer{margin-top:28px;color:#5b5b5b;font-size:12px;text-align:center}footer b{color:var(--gold);font-family:"Montserrat";letter-spacing:.1em}
  @media(max-width:560px){.row2{flex-direction:column;align-items:flex-start}.chat{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl"><span class="dot"></span><div><h1>Panel de Leads</h1><span>Fénix Prime · Reto 7 Días</span></div></div>
    <div class="meta"><div class="live"><span class="pulse"></span>En vivo</div>
      <div class="count"><b id="total">0</b><small>leads</small></div>
      <div class="count"><b id="gest" style="color:#4cd183">0</b><small>gestionados</small></div>
      <div class="count"><b id="pend" style="color:var(--orange)">0</b><small>pendientes</small></div></div>
  </header>
  <div class="tools">
    <input id="search" type="text" placeholder="Buscar por nombre o número...">
    <div class="chips">
      <button class="chip on" data-f="todos">Todos</button>
      <button class="chip" data-f="pendiente">Pendientes</button>
      <button class="chip" data-f="gestionado">Gestionados</button>
    </div>
  </div>
  <div class="upd" id="upd">Conectando...</div>
  <div class="list" id="list"></div>
  <footer><b>FÉNIX PRIME</b> · Marca el estado y el día. Se guarda y se actualiza solo.</footer>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo97DYJUGXRDLqUTsGayTzulXiHts0XFsuOL4Mo5Y52VO3OXFr3JkgiHWC5UGKgYn_/exec";
  const KEY = "fenix2026";
  const POLL_MS = 8000;

  let leads = [], firstLoad = true, filter = "todos";
  const seen = new Set();
  const overrides = {}; // row -> {fields, ts}

  function waNumber(raw){
    let d=String(raw||'').replace(/\D/g,'');
    if(d.length===12 && d.slice(0,2)==='57') return d;
    if(d.length===10) return '57'+d;
    if(d.length>=11 && d.length<=13) return d;
    return '';
  }
  function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'';}
  function welcome(n){return `¡Hola ${firstName(n)}! 🔥 Soy del equipo de Fénix Prime. Ya tienes tu Reto 7 Días 💪 Quería darte la bienvenida y acompañarte para que de verdad sientas el cambio. ¿Empezamos hoy con el Día 1? 👊`;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function daysSince(d){
    if(!d) return null;
    const t=new Date(d).getTime(); if(isNaN(t)) return null;
    return Math.floor((Date.now()-t)/86400000);
  }
  function lastLabel(d){
    const n=daysSince(d);
    if(n===null) return 'Último mensaje: <b>sin contactar</b>';
    if(n===0) return 'Último mensaje: <b>hoy</b>';
    if(n===1) return 'Último mensaje: <b>hace 1 día</b>';
    return 'Último mensaje: <span class="alert">hace '+n+' días</span>';
  }
  function k(l){return (l.fecha||'')+'|'+(l.whatsapp||'')+'|'+(l.nombre||'');}
  function merged(l){const o=overrides[l.row]; return o?Object.assign({},l,o.fields):l;}

  function update(row, fields){
    overrides[row]={fields:Object.assign((overrides[row]||{}).fields||{},fields), ts:Date.now()};
    render();
    const params=new URLSearchParams();
    params.append('action','update'); params.append('row',row);
    Object.keys(fields).forEach(key=>params.append(key, fields[key]));
    fetch(SCRIPT_URL,{method:'POST',body:params,mode:'no-cors'}).catch(()=>{});
    setTimeout(poll, 1600);
  }

  function setEstado(row, cur){ update(row, {estado: cur==='Gestionado'?'Pendiente':'Gestionado'}); }
  function setDia(row, d){ update(row, {dia: d}); }
  function openChat(row, nombre, num){
    update(row, {ultimaGestion: new Date().toISOString()});
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(welcome(nombre))}`,'_blank');
  }

  function render(){
    const q=(document.getElementById('search').value||'').toLowerCase().trim();
    const list=document.getElementById('list');
    const all=leads.map(merged);
    document.getElementById('total').textContent=all.length;
    var nGest=all.filter(l=>(l.estado||'Pendiente')==='Gestionado').length;
    document.getElementById('gest').textContent=nGest;
    document.getElementById('pend').textContent=all.length-nGest;
    let view=all.filter(l=>{
      if(filter==='pendiente' && (l.estado||'Pendiente')==='Gestionado') return false;
      if(filter==='gestionado' && (l.estado||'Pendiente')!=='Gestionado') return false;
      if(q && !(String(l.nombre||'').toLowerCase().includes(q)||String(l.whatsapp||'').includes(q))) return false;
      return true;
    });
    if(view.length===0){
      list.innerHTML='<div class="empty"><div class="ico">📭</div>'+(leads.length===0?'Aún no hay leads. Aparecerán aquí en tiempo real apenas alguien llene el formulario.':'Sin resultados.')+'</div>';
      return;
    }
    list.innerHTML=view.map(l=>{
      const num=waNumber(l.whatsapp);
      const isNew=!seen.has(k(l)) && !firstLoad;
      const gest=(l.estado||'Pendiente')==='Gestionado';
      const dia=parseInt(l.dia,10)||0;
      const dbtns=[1,2,3,4,5,6,7].map(n=>`<button class="dbtn ${n===dia?'on':''}" onclick="setDia(${l.row},${n})">${n}</button>`).join('');
      const chat=num?`<button class="chat" onclick="openChat(${l.row},'${esc(l.nombre).replace(/'/g,"\\'")}','${num}')">💬 Chatear</button>`:`<span class="chat off">Sin número</span>`;
      return `<div class="lead ${isNew?'new':''}">
        <div class="top">
          <div>
            <div class="name">${esc(l.nombre)||'Sin nombre'} ${isNew?'<span class="badge">Nuevo</span>':''}</div>
            <div class="sub"><span>📱 <b>${esc(l.whatsapp)||'—'}</b></span>${l.correo?`<span>✉️ ${esc(l.correo)}</span>`:''}</div>
          </div>
          <span class="pill ${gest?'gest':'pend'}" onclick="setEstado(${l.row},'${gest?'Gestionado':'Pendiente'}')">${gest?'✓ Gestionado':'● Pendiente'}</span>
        </div>
        <div class="row2">
          <div class="days"><span class="lbl">Día del reto:</span>${dbtns}</div>
        </div>
        <div class="row2">
          <div class="last">${lastLabel(l.ultimaGestion)}</div>
          ${chat}
        </div>
      </div>`;
    }).join('');
    leads.forEach(l=>seen.add(k(l)));
  }

  function applyData(data){
    if(!data || data.error){
      document.getElementById('upd').innerHTML='⚠️ Sin conexión. Revisa que la implementación esté en "Cualquier persona" y la clave sea correcta.';
      if(leads.length===0) document.getElementById('list').innerHTML='<div class="err">Sin conexión con la base de datos.</div>';
      return;
    }
    leads=data.leads||[];
    // limpiar overrides ya escritos (más de 6s)
    Object.keys(overrides).forEach(r=>{ if(Date.now()-overrides[r].ts>6000) delete overrides[r]; });
    render(); firstLoad=false;
    document.getElementById('upd').textContent='Actualizado a las '+new Date().toLocaleTimeString('es-CO');
  }

  function demoData(){const now=Date.now();return {leads:[
    {row:5,fecha:new Date(now-30000),nombre:'María Gómez',whatsapp:'3144906088',correo:'maria@email.com',estado:'Pendiente',dia:1,ultimaGestion:''},
    {row:4,fecha:new Date(now-600000),nombre:'Carlos Ruiz',whatsapp:'3001234567',correo:'',estado:'Gestionado',dia:3,ultimaGestion:new Date(now-86400000*2)},
    {row:3,fecha:new Date(now-7200000),nombre:'Ana Torres',whatsapp:'3209876543',correo:'ana@email.com',estado:'Pendiente',dia:0,ultimaGestion:new Date(now-3600000)}
  ]};}

  function poll(){
    if(location.search.includes('demo')){applyData(demoData());return;}
    const cb='cb_'+Date.now();
    window[cb]=function(d){applyData(d);clean();};
    const s=document.createElement('script');
    s.src=SCRIPT_URL+'?key='+encodeURIComponent(KEY)+'&callback='+cb+'&t='+Date.now();
    s.onerror=function(){document.getElementById('upd').textContent='⚠️ Error de conexión. Reintentando...';clean();};
    function clean(){try{delete window[cb];}catch(e){}if(s.parentNode)s.parentNode.removeChild(s);}
    document.body.appendChild(s);
  }

  document.getElementById('search').addEventListener('input',render);
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); filter=c.dataset.f; render();
  }));
  poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
